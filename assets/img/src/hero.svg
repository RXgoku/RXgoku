<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <g id="pendant">
      <path d="M0 -260 V-70" stroke="#2E1D14" stroke-width="6"/>
      <path d="M-70 -10 Q-70 -80 0 -80 Q70 -80 70 -10 Z" fill="#FFD25E" stroke="#2E1D14" stroke-width="7" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-8" rx="70" ry="14" fill="#FFE49B" stroke="#2E1D14" stroke-width="7"/>
      <circle cx="0" cy="-8" r="22" fill="#FFF6D6"/>
    </g>
    <g id="cup">
      <path d="M-30 0 H30 L24 110 Q23 118 15 118 H-15 Q-23 118 -24 110 Z" fill="var(--liq,#B57A4B)" stroke="#2E1D14" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-30 0 H30 L28 18 H-28 Z" fill="var(--foam,#F4E3D3)"/>
      <path d="M-32 0 Q0 -26 32 0 Z" fill="#FFFFFF" stroke="#2E1D14" stroke-width="6" stroke-linejoin="round"/>
      <path d="M12 -34 L6 46" stroke="var(--straw,#C2276B)" stroke-width="8" stroke-linecap="round"/>
      <g fill="var(--pearl,#2A1710)"><circle cx="-10" cy="104" r="5"/><circle cx="2" cy="107" r="5"/><circle cx="13" cy="103" r="5"/><circle cx="-4" cy="95" r="5"/><circle cx="8" cy="95" r="4.5"/></g>
    </g>
    <g id="person">
      <circle cx="0" cy="-92" r="34" fill="var(--skin,#8A5A3C)" stroke="#2E1D14" stroke-width="6"/>
      <path d="M-44 -70 Q-70 -60 -74 0 H74 Q70 -60 44 -70 Q0 -50 -44 -70 Z" fill="var(--shirt,#5B4374)" stroke="#2E1D14" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g id="stool">
      <rect x="-40" y="0" width="80" height="18" rx="9" fill="#C2276B" stroke="#2E1D14" stroke-width="6"/>
      <path d="M-24 18 V120 M24 18 V120" stroke="#2E1D14" stroke-width="8" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Upper wall -->
  <rect width="1600" height="1200" fill="#F3DED2"/>
  <!-- Wainscot -->
  <rect y="560" width="1600" height="260" fill="#6E4A36"/>
  <path d="M0 560 H1600" stroke="#2E1D14" stroke-width="8"/>
  <g stroke="#2E1D14" stroke-width="5" opacity=".55">
    <path d="M120 560 V820 M360 560 V820 M600 560 V820 M840 560 V820 M1080 560 V820 M1320 560 V820"/>
  </g>
  <!-- Floor -->
  <rect y="820" width="1600" height="380" fill="#B86B4B"/>
  <path d="M0 820 H1600" stroke="#2E1D14" stroke-width="8"/>
  <g stroke="#2E1D14" stroke-width="4" opacity=".45">
    <path d="M0 900 H1600 M0 990 H1600 M0 1090 H1600"/>
    <path d="M200 820 L120 1200 M500 820 L470 1200 M800 820 L800 1200 M1100 820 L1130 1200 M1400 820 L1480 1200"/>
  </g>

  <!-- Window, evening -->
  <g>
    <rect x="70" y="120" width="330" height="400" rx="10" fill="#8E6BB5" stroke="#2E1D14" stroke-width="8"/>
    <rect x="70" y="120" width="330" height="140" rx="10" fill="#D9C4EE"/>
    <rect x="70" y="250" width="330" height="90" fill="#B08CD6"/>
    <path d="M70 340 H400" stroke="#2E1D14" stroke-width="6"/>
    <path d="M235 120 V520 M70 320 H400" stroke="#2E1D14" stroke-width="8"/>
    <circle cx="150" cy="220" r="34" fill="#FFD25E" stroke="#2E1D14" stroke-width="6"/>
    <path d="M70 440 l60-60 l50 40 l70-90 l60 60 l90-70 V520 H70 Z" fill="#2C1A3C" stroke="#2E1D14" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Menu board -->
  <g>
    <rect x="560" y="120" width="560" height="300" rx="14" fill="#2E1D14" stroke="#150E0A" stroke-width="8"/>
    <text x="600" y="200" font-family="Outfit, Geist, sans-serif" font-weight="900" font-size="66" fill="#F2679F" letter-spacing="-3">Barako</text>
    <g stroke="#F9F1E9" stroke-width="7" stroke-linecap="round" opacity=".85">
      <path d="M600 250 H820 M960 250 H1080"/>
      <path d="M600 296 H760 M960 296 H1080"/>
      <path d="M600 342 H860 M960 342 H1080"/>
      <path d="M600 388 H800 M960 388 H1080"/>
    </g>
    <g stroke="#FFD25E" stroke-width="7" stroke-linecap="round">
      <path d="M860 250 H900 M790 296 H840 M890 342 H920 M830 388 H870"/>
    </g>
  </g>

  <!-- Pendants -->
  <use href="#pendant" x="1180" y="330"/>
  <use href="#pendant" x="1360" y="330"/>
  <use href="#pendant" x="1540" y="330"/>

  <!-- Shelf with cups, right wall -->
  <g>
    <rect x="1220" y="440" width="380" height="16" fill="#C99A6B" stroke="#2E1D14" stroke-width="6"/>
    <use href="#cup" x="1270" y="330" style="--liq:#B08CD6;--foam:#EBDFF5;--pearl:#2C1A3C"/>
    <use href="#cup" x="1360" y="330" style="--liq:#4B63C9;--foam:#DDE4FF;--pearl:#3B4DA8;--straw:#FFD25E"/>
    <use href="#cup" x="1450" y="330" style="--liq:#5F8F49;--foam:#DCE9C8;--pearl:#1E3A2A"/>
    <use href="#cup" x="1540" y="330" style="--liq:#E8677E;--foam:#FFE1E7;--pearl:#C2276B;--straw:#2E1D14"/>
  </g>

  <!-- Booth, left -->
  <g>
    <rect x="80" y="560" width="120" height="330" rx="26" fill="#F2679F" stroke="#2E1D14" stroke-width="8"/>
    <rect x="80" y="800" width="360" height="90" rx="26" fill="#F2679F" stroke="#2E1D14" stroke-width="8"/>
    <rect x="560" y="560" width="120" height="330" rx="26" fill="#F2679F" stroke="#2E1D14" stroke-width="8"/>
    <rect x="440" y="800" width="240" height="90" rx="26" fill="#F2679F" stroke="#2E1D14" stroke-width="8"/>
    <!-- people -->
    <use href="#person" x="280" y="850" style="--skin:#6B3F27;--shirt:#FFD25E"/>
    <use href="#person" x="500" y="850" style="--skin:#A56B4B;--shirt:#1E3A2A"/>
    <!-- table -->
    <rect x="200" y="880" width="380" height="26" rx="8" fill="#C99A6B" stroke="#2E1D14" stroke-width="7"/>
    <path d="M390 906 V1080" stroke="#2E1D14" stroke-width="12" stroke-linecap="round"/>
    <path d="M330 1080 H450" stroke="#2E1D14" stroke-width="12" stroke-linecap="round"/>
    <use href="#cup" x="300" y="770" style="--liq:#B57A4B;--foam:#F4E3D3;--pearl:#2A1710"/>
    <use href="#cup" x="470" y="770" style="--liq:#F4D3DC;--foam:#FFF3F6;--pearl:#F7F2EE;--straw:#8E1A5C"/>
    <rect x="360" y="820" width="90" height="62" rx="6" fill="#241811" stroke="#2E1D14" stroke-width="6"/>
  </g>

  <!-- Counter, right -->
  <g>
    <rect x="860" y="700" width="740" height="60" rx="10" fill="#C99A6B" stroke="#2E1D14" stroke-width="8"/>
    <rect x="880" y="760" width="720" height="330" fill="#3A2418" stroke="#2E1D14" stroke-width="8"/>
    <g stroke="#2E1D14" stroke-width="5" opacity=".6"><path d="M880 850 H1600 M880 940 H1600 M880 1030 H1600"/></g>
    <!-- barista -->
    <g transform="translate(1020 700)">
      <use href="#person" style="--skin:#7D4A2E;--shirt:#241811"/>
      <path d="M-44 -72 Q0 -30 44 -72" fill="none" stroke="#FFF6FA" stroke-width="8"/>
    </g>
    <!-- ramen pot -->
    <g transform="translate(1230 700)">
      <rect x="-70" y="-90" width="140" height="90" rx="8" fill="#241811" stroke="#2E1D14" stroke-width="7"/>
      <rect x="-80" y="-98" width="160" height="16" rx="8" fill="#6E574B" stroke="#2E1D14" stroke-width="6"/>
      <g fill="none" stroke="#F9F1E9" stroke-width="6" stroke-linecap="round" opacity=".8">
        <path d="M-30 -120 q-10-18 0-36 t0-30"/><path d="M0 -126 q-10-18 0-36 t0-30"/><path d="M30 -120 q-10-18 0-36 t0-30"/>
      </g>
    </g>
    <!-- matcha bowl -->
    <g transform="translate(1400 700)">
      <path d="M-60 -50 Q-50 0 0 0 Q50 0 60 -50 Z" fill="#E8DCCB" stroke="#2E1D14" stroke-width="7"/>
      <ellipse cx="0" cy="-50" rx="60" ry="14" fill="#5F8F49" stroke="#2E1D14" stroke-width="7"/>
      <path d="M-4 -140 V-60" stroke="#D9B98C" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- cups on counter -->
    <use href="#cup" x="1520" y="590" style="--liq:#B57A4B;--foam:#F4E3D3;--pearl:#2A1710"/>
    <!-- stools -->
    <use href="#stool" x="960" y="900"/>
    <use href="#stool" x="1140" y="900"/>
    <use href="#stool" x="1320" y="900"/>
  </g>

  <!-- Plant -->
  <g transform="translate(760 820)">
    <path d="M-60 0 H60 L48 150 H-48 Z" fill="#C2276B" stroke="#2E1D14" stroke-width="8" stroke-linejoin="round"/>
    <g fill="#2A4A38" stroke="#2E1D14" stroke-width="7" stroke-linejoin="round">
      <path d="M0 0 Q-90 -60 -70 -170 Q-10 -130 0 0Z"/>
      <path d="M0 0 Q90 -70 80 -180 Q10 -140 0 0Z"/>
      <path d="M0 0 Q-10 -120 0 -230 Q30 -120 0 0Z"/>
    </g>
  </g>

  <!-- Foreground table edge and one big cup -->
  <rect y="1080" width="1600" height="120" fill="#C99A6B" stroke="#2E1D14" stroke-width="8"/>
  <g transform="translate(1000 900) scale(2.2)">
    <use href="#cup" style="--liq:#B57A4B;--foam:#F4E3D3;--pearl:#2A1710"/>
  </g>
</svg>
