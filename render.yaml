# Render Blueprint: New > Blueprint > pick this repo. One free web service runs
# the game server and serves the built client (WebSockets included).
services:
  - type: web
    name: battle-royale
    runtime: node
    plan: free
    rootDir: battle-royale
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ZONE_TIME_SCALE # 1 = ~4 minute match; raise it for shorter demo matches
        value: "1"
      - key: BOTS # bots fill each match up to this many players; 0 disables
        value: "10"
